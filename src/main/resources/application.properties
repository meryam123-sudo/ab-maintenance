spring.application.name=ab-maintenance

# ===============================
# BASE DE DONNEES MYSQL
# ===============================

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ab_maintenance?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVEUR
# ===============================

server.port=${PORT:8080}

# ===============================
# URL DE L'APPLICATION
# ===============================

app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===============================
# ASSISTANT IA / OLLAMA
# ===============================

ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:gemma3:1b}
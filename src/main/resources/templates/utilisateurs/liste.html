<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Gestion des utilisateurs - AB Maintenance
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(
                135deg,
                #141c26,
                #283949
            );
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: rgba(20, 28, 38, 0.98) !important;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
            padding: 14px 20px;
        }

        .navbar-brand {
            font-size: 22px;
            font-weight: 700;
        }

        .page-container {
            max-width: 1450px;
            margin: 40px auto;
            padding: 0 25px 50px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-header p {
            color: #c4ccd4;
            margin-bottom: 0;
        }

        .table-card {
            background: white;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.25);
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: #212529;
            color: white;
            border: none;
            padding: 16px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 14px 16px;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #f8f9fa;
        }

        .btn {
            border-radius: 9px;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .role-badge,
        .status-badge {
            padding: 7px 10px;
            border-radius: 8px;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #6c757d;
        }

        @media (max-width: 768px) {

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/dashboard}">

            <i class="bi bi-gear-wide-connected me-2"></i>
            AB Maintenance

        </a>

        <a th:href="@{/dashboard}"
           class="btn btn-outline-light">

            <i class="bi bi-speedometer2 me-1"></i>
            Dashboard

        </a>

    </div>

</nav>

<div class="page-container">

    <div class="page-header">

        <div>

            <h1>

                <i class="bi bi-people me-2"></i>
                Gestion des utilisateurs

            </h1>

            <p>
                Ajoutez, modifiez et gérez les comptes utilisateurs.
            </p>

        </div>

        <a th:href="@{/utilisateurs/ajouter}"
           class="btn btn-primary">

            <i class="bi bi-person-plus me-1"></i>
            Ajouter un utilisateur

        </a>

    </div>

    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Rôle</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="utilisateur : ${utilisateurs}">

                    <td th:text="${utilisateur.id}">
                    </td>

                    <td>
                        <strong th:text="${utilisateur.nom}">
                        </strong>
                    </td>

                    <td th:text="${utilisateur.prenom}">
                    </td>

                    <td th:text="${utilisateur.email}">
                    </td>

                    <td th:text="${utilisateur.telephone != null
                        ? utilisateur.telephone
                        : '-'}">
                    </td>

                    <td>

                        <span
                            class="badge bg-primary role-badge"
                            th:text="${utilisateur.role != null
                                ? utilisateur.role.nom
                                : 'Aucun rôle'}">
                        </span>

                    </td>

                    <td>

                        <span th:if="${utilisateur.actif}"
                              class="badge bg-success status-badge">

                            <i class="bi bi-check-circle me-1"></i>
                            Actif

                        </span>

                        <span th:unless="${utilisateur.actif}"
                              class="badge bg-danger status-badge">

                            <i class="bi bi-x-circle me-1"></i>
                            Inactif

                        </span>

                    </td>

                    <td>

                        <div class="action-buttons">

                            <a
                                th:href="@{/utilisateurs/modifier/{id}(id=${utilisateur.id})}"
                                class="btn btn-warning btn-sm">

                                <i class="bi bi-pencil-square me-1"></i>
                                Modifier

                            </a>

                            <a
                                th:href="@{/utilisateurs/changer-statut/{id}(id=${utilisateur.id})}"
                                class="btn btn-secondary btn-sm">

                                <i
                                    th:class="${utilisateur.actif
                                        ? 'bi bi-person-dash me-1'
                                        : 'bi bi-person-check me-1'}">
                                </i>

                                <span th:if="${utilisateur.actif}">
                                    Désactiver
                                </span>

                                <span th:unless="${utilisateur.actif}">
                                    Activer
                                </span>

                            </a>

                            <a
                                th:href="@{/utilisateurs/supprimer/{id}(id=${utilisateur.id})}"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm(
                                    'Voulez-vous vraiment supprimer cet utilisateur ?'
                                );">

                                <i class="bi bi-trash me-1"></i>
                                Supprimer

                            </a>

                        </div>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(utilisateurs)}">

                    <td colspan="8"
                        class="empty-state">

                        <i class="bi bi-people fs-2 d-block mb-2"></i>

                        Aucun utilisateur enregistré.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <div class="mt-4">

        <a th:href="@{/dashboard}"
           class="btn btn-outline-light">

            <i class="bi bi-arrow-left me-1"></i>
            Retour au Dashboard

        </a>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

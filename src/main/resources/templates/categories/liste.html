<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Gestion des catégories</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>
            Gestion des catégories
        </h1>

        <a th:href="@{/categories/ajouter}"
           class="btn btn-primary">

            + Ajouter une catégorie

        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="categorie : ${categories}">

                        <td th:text="${categorie.id}">
                        </td>

                        <td th:text="${categorie.nom}">
                        </td>

                        <td th:text="${categorie.description}">
                        </td>

                        <td>

                            <a th:href="@{/categories/modifier/{id}(id=${categorie.id})}"
                               class="btn btn-warning btn-sm">

                                Modifier

                            </a>

                            <a th:href="@{/categories/supprimer/{id}(id=${categorie.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Voulez-vous vraiment supprimer cette catégorie ?');">

                                Supprimer

                            </a>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(categories)}">

                        <td colspan="4"
                            class="text-center text-muted">

                            Aucune catégorie enregistrée.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <div class="mt-4">

        <a th:href="@{/dashboard}"
           class="btn btn-secondary">

            Retour au Dashboard

        </a>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

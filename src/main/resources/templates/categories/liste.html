<!DOCTYPE html>

<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Gestion des catégories - AB Maintenance
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(
                135deg,
                #141c26,
                #283949
            );
            font-family: Arial, sans-serif;
        }

        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            background: rgba(20, 28, 38, 0.98) !important;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
            padding: 14px 20px;
        }

        .navbar-brand {
            font-size: 22px;
            font-weight: 700;
        }

        /* =========================
           PAGE
           ========================= */

        .page-container {
            max-width: 1450px;
            margin: 40px auto;
            padding: 0 25px 50px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-header p {
            color: #c4ccd4;
            margin-bottom: 0;
        }

        /* =========================
           TABLEAU
           ========================= */

        .table-card {
            background: white;
            border: none;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.25);
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: #212529;
            color: white;
            border: none;
            padding: 16px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 14px 16px;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #f8f9fa;
        }

        /* =========================
           BOUTONS
           ========================= */

        .btn {
            border-radius: 9px;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        /* =========================
           BADGE
           ========================= */

        .category-badge {
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        /* =========================
           ETAT VIDE
           ========================= */

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #6c757d;
        }

        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 768px) {

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>


<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav class="navbar navbar-dark">

    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/dashboard}">

            <i class="bi bi-gear-wide-connected me-2"></i>
            AB Maintenance

        </a>


        <a th:href="@{/dashboard}"
           class="btn btn-outline-light">

            <i class="bi bi-speedometer2 me-1"></i>
            Dashboard

        </a>

    </div>

</nav>


<!-- ========================= -->
<!-- CONTENU -->
<!-- ========================= -->

<div class="page-container">


    <!-- HEADER -->

    <div class="page-header">

        <div>

            <h1>

                <i class="bi bi-tags me-2"></i>
                Gestion des catégories

            </h1>

            <p>
                Ajoutez, modifiez et gérez les catégories d'équipements.
            </p>

        </div>


        <a th:href="@{/categories/ajouter}"
           class="btn btn-primary">

            <i class="bi bi-plus-circle me-1"></i>
            Ajouter une catégorie

        </a>

    </div>


    <!-- ========================= -->
    <!-- TABLEAU -->
    <!-- ========================= -->

    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <!-- LISTE DES CATEGORIES -->

                <tr th:each="categorie : ${categories}">

                    <td th:text="${categorie.id}">
                    </td>


                    <td>

                        <span class="badge bg-primary category-badge"
                              th:text="${categorie.nom}">
                        </span>

                    </td>


                    <td th:text="${categorie.description != null
                        ? categorie.description
                        : '-'}">
                    </td>


                    <td>

                        <div class="action-buttons">


                            <!-- MODIFIER -->

                            <a
                                th:href="@{/categories/modifier/{id}(id=${categorie.id})}"
                                class="btn btn-warning btn-sm">

                                <i class="bi bi-pencil-square me-1"></i>
                                Modifier

                            </a>


                            <!-- SUPPRIMER -->

                            <a
                                th:href="@{/categories/supprimer/{id}(id=${categorie.id})}"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm(
                                    'Voulez-vous vraiment supprimer cette catégorie ?'
                                );">

                                <i class="bi bi-trash me-1"></i>
                                Supprimer

                            </a>


                        </div>

                    </td>

                </tr>


                <!-- ========================= -->
                <!-- AUCUNE CATEGORIE -->
                <!-- ========================= -->

                <tr th:if="${#lists.isEmpty(categories)}">

                    <td colspan="4"
                        class="empty-state">

                        <i class="bi bi-tags fs-2 d-block mb-2"></i>

                        Aucune catégorie enregistrée.

                    </td>

                </tr>


                </tbody>

            </table>

        </div>

    </div>


    <!-- ========================= -->
    <!-- RETOUR -->
    <!-- ========================= -->

    <div class="mt-4">

        <a th:href="@{/dashboard}"
           class="btn btn-outline-light">

            <i class="bi bi-arrow-left me-1"></i>
            Retour au Dashboard

        </a>

    </div>


</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interventions - AB Maintenance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg,#141c26,#283949);
            font-family: Arial,sans-serif;
        }

        .navbar {
            background: rgba(20,28,38,.98)!important;
            padding:14px 20px;
            box-shadow:0 4px 18px rgba(0,0,0,.25);
        }

        .navbar-brand {
            font-weight:700;
            font-size:22px;
        }

        .page-container {
            max-width:1450px;
            margin:40px auto;
            padding:0 25px 50px;
        }

        .page-header {
            color:white;
            margin-bottom:25px;
        }

        .page-header h1 {
            font-weight:700;
            font-size:36px;
        }

        .page-header p {
            color:#c4ccd4;
        }

        .table-card {
            background:white;
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 14px 35px rgba(0,0,0,.25);
        }

        .table {
            margin:0;
        }

        .table thead th {
            background:#212529;
            color:white;
            border:none;
            padding:16px;
        }

        .table tbody td {
            padding:14px 16px;
            vertical-align:middle;
        }

        .btn {
            border-radius:9px;
            font-weight:500;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/dashboard}">

            <i class="bi bi-gear-wide-connected me-2"></i>
            AB Maintenance

        </a>

        <a th:href="@{/dashboard}"
           class="btn btn-outline-light">

            <i class="bi bi-speedometer2 me-1"></i>
            Dashboard

        </a>

    </div>

</nav>

<div class="page-container">

    <div class="page-header">

        <h1>
            <i class="bi bi-tools me-2"></i>
            Gestion des interventions
        </h1>

        <p>
            Consultez et suivez les interventions techniques.
        </p>

    </div>

    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                <tr>
                    <th>Référence</th>
                    <th>Panne</th>
                    <th>Équipement</th>
                    <th>Technicien</th>
                    <th>Statut</th>
                    <th>Date début</th>
                    <th>Date fin</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="intervention : ${interventions}">

                    <td>
                        <strong th:text="${intervention.reference}">
                        </strong>
                    </td>

                    <td th:text="${intervention.panne.reference}">
                    </td>

                    <td th:text="${intervention.panne.equipement.nom}">
                    </td>

                    <td>

                        <span th:if="${intervention.technicien != null}"
                              th:text="${intervention.technicien.prenom + ' ' + intervention.technicien.nom}">
                        </span>

                        <span th:if="${intervention.technicien == null}"
                              class="text-muted">

                            Non affecté

                        </span>

                    </td>

                    <td>

                        <span th:if="${intervention.statut.name() == 'PLANIFIEE'}"
                              class="badge bg-secondary">
                            Planifiée
                        </span>

                        <span th:if="${intervention.statut.name() == 'AFFECTEE'}"
                              class="badge bg-primary">
                            Affectée
                        </span>

                        <span th:if="${intervention.statut.name() == 'EN_COURS'}"
                              class="badge bg-warning text-dark">
                            En cours
                        </span>

                        <span th:if="${intervention.statut.name() == 'EN_ATTENTE'}"
                              class="badge bg-info text-dark">
                            En attente
                        </span>

                        <span th:if="${intervention.statut.name() == 'TERMINEE'}"
                              class="badge bg-success">
                            Terminée
                        </span>

                        <span th:if="${intervention.statut.name() == 'ANNULEE'}"
                              class="badge bg-danger">
                            Annulée
                        </span>

                    </td>

                    <td th:text="${intervention.dateDebut}">
                    </td>

                    <td th:text="${intervention.dateFin}">
                    </td>

                    <td>

                        <a th:href="@{/interventions/{id}(id=${intervention.id})}"
                           class="btn btn-sm btn-primary">

                            <i class="bi bi-eye me-1"></i>
                            Voir

                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(interventions)}">

                    <td colspan="8"
                        class="text-center text-muted py-4">

                        Aucune intervention enregistrée.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

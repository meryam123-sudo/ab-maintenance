<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planifier une intervention - AB Maintenance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            min-height:100vh;
            margin:0;
            background:linear-gradient(135deg,#141c26,#283949);
            font-family:Arial,sans-serif;
        }

        .navbar {
            background:rgba(20,28,38,.98)!important;
            padding:14px 20px;
        }

        .navbar-brand {
            font-weight:700;
            font-size:22px;
        }

        .page-container {
            max-width:900px;
            margin:40px auto;
            padding:0 25px 50px;
        }

        .page-header {
            color:white;
            margin-bottom:25px;
        }

        .page-header h1 {
            font-weight:700;
            font-size:36px;
        }

        .form-card {
            background:white;
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 14px 35px rgba(0,0,0,.25);
        }

        .card-title-bar {
            background:#212529;
            color:white;
            padding:20px 25px;
        }

        .form-card .card-body {
            padding:30px;
        }

        .form-label {
            font-weight:600;
        }

        .form-control,
        .form-select {
            border-radius:10px;
            padding:11px 13px;
        }

        .btn {
            border-radius:9px;
            font-weight:500;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/dashboard}">

            <i class="bi bi-gear-wide-connected me-2"></i>
            AB Maintenance

        </a>

        <a th:href="@{/pannes}"
           class="btn btn-outline-light">

            Retour aux pannes

        </a>

    </div>

</nav>

<div class="page-container">

    <div class="page-header">

        <h1>
            <i class="bi bi-calendar-plus me-2"></i>
            Planifier une intervention
        </h1>

    </div>

    <div class="form-card">

        <div class="card-title-bar">

            <h4 class="mb-0">
                Informations de l'intervention
            </h4>

        </div>

        <div class="card-body">

            <div class="alert alert-light border">

                <p class="mb-2">

                    <strong>Panne :</strong>

                    <span th:text="${intervention.panne.reference}">
                    </span>

                </p>

                <p class="mb-0">

                    <strong>Équipement :</strong>

                    <span th:text="${intervention.panne.equipement.nom}">
                    </span>

                </p>

            </div>

            <form th:action="@{/interventions/enregistrer}"
                  th:object="${intervention}"
                  method="post">

                <input type="hidden"
                       th:field="*{panne.id}">

                <div class="mb-3">

                    <label class="form-label">
                        Référence de l'intervention
                    </label>

                    <input type="text"
                           th:field="*{reference}"
                           class="form-control"
                           placeholder="Exemple : INT-001"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Technicien
                    </label>

                    <select th:field="*{technicien.id}"
                            class="form-select"
                            required>

                        <option value="">
                            -- Choisir un technicien --
                        </option>

                        <option th:each="technicien : ${techniciens}"
                                th:value="${technicien.id}"
                                th:text="${technicien.prenom + ' ' + technicien.nom}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Date et heure prévues
                    </label>

                    <input type="datetime-local"
                           th:field="*{dateDebut}"
                           class="form-control">

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Statut
                    </label>

                    <input type="text"
                           class="form-control"
                           value="PLANIFIEE"
                           disabled>

                    <input type="hidden"
                           th:field="*{statut}">

                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check-circle me-1"></i>
                        Créer l'intervention

                    </button>

                    <a th:href="@{/pannes}"
                       class="btn btn-secondary">

                        Annuler

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${role.id == null
        ? 'Ajouter un rôle'
        : 'Modifier un rôle'}">
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">

            <h2 class="mb-0"
                th:text="${role.id == null
                    ? 'Ajouter un rôle'
                    : 'Modifier un rôle'}">
            </h2>

        </div>

        <div class="card-body">

            <form th:action="@{/roles/enregistrer}"
                  th:object="${role}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">

                    <label class="form-label">
                        Nom du rôle
                    </label>

                    <input type="text"
                           th:field="*{nom}"
                           class="form-control"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-success">

                    Enregistrer

                </button>

                <a th:href="@{/roles}"
                   class="btn btn-secondary">

                    Annuler

                </a>

            </form>

        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>

<!DOCTYPE html>

<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Diagnostic - AB Maintenance
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<h1>Diagnostic assisté</h1>

<p>
    Le système analyse les symptômes
    enregistrés pour cette panne.
</p>

<hr>

<h2>Causes possibles</h2>

<div class="table-responsive">

    <table class="table table-striped table-hover align-middle">

    <thead>

    <tr>
        <th>Cause</th>
        <th>Score</th>
        <th>Description</th>
        <th>Recommandation</th>
    </tr>

    <thead class="table-dark">

    <tbody>

    <tr th:each="resultat : ${resultats}">

        <td th:text="${resultat.cause.nom}">
        </td>

        <td>

            <span th:text="${resultat.score}">
            </span>

            points

        </td>

        <td th:text="${resultat.cause.description}">
        </td>

        <td th:text="${resultat.cause.solution}">
        </td>

    </tr>

    </tbody>

</table>

<p th:if="${#lists.isEmpty(resultats)}">
    Aucune cause probable trouvée pour les symptômes sélectionnés.
</p>

<br>

<a th:href="@{/pannes/{id}(id=${panneId})}">
    Retour à la panne
</a>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

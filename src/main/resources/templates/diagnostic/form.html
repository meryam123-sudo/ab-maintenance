<!DOCTYPE html>

<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Assistance au diagnostic - AB Maintenance
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">

            <h3 class="mb-0">
                Assistance intelligente au diagnostic
            </h3>

        </div>

        <div class="card-body">

            <!-- Informations de la panne -->

            <h5>
                Panne :
                <span th:text="${panne.reference}">
                </span>
            </h5>

            <p>
                <strong>Équipement :</strong>

                <span
                    th:text="${panne.equipement.nom}">
                </span>
            </p>

            <p>
                <strong>Description :</strong>

                <span
                    th:text="${panne.description}">
                </span>
            </p>

            <hr>

            <h5>
                Sélectionnez les symptômes observés
            </h5>

            <p class="text-muted">
                Cochez tous les symptômes constatés sur l'équipement.
                Le système analysera ensuite les causes possibles.
            </p>


            <form
                th:action="@{/diagnostic/analyser/{id}(id=${panne.id})}"
                method="post">

                <div class="row">

                    <div
                        class="col-md-6 mb-3"
                        th:each="symptome : ${symptomes}">

                        <div class="form-check border rounded p-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="symptomeIds"
                                th:value="${symptome.id}"
                                th:id="'symptome-' + ${symptome.id}">

                            <label
                                class="form-check-label"
                                th:for="'symptome-' + ${symptome.id}">

                                <strong
                                    th:text="${symptome.nom}">
                                </strong>

                                <br>

                                <span
                                    class="text-muted"
                                    th:text="${symptome.description}">
                                </span>

                            </label>

                        </div>

                    </div>

                </div>


                <div
                    class="alert alert-warning"
                    th:if="${#lists.isEmpty(symptomes)}">

                    Aucun symptôme n'est encore enregistré.

                </div>


                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Analyser les symptômes

                    </button>

                    <a
                        th:href="@{/pannes/{id}(id=${panne.id})}"
                        class="btn btn-secondary">

                        Annuler

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

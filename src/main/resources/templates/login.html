<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Connexion - AB Maintenance</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(
                    135deg,
                    rgba(20, 28, 38, 0.97),
                    rgba(40, 57, 73, 0.92)
                );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 38px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.30);
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #212529;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 5px;
        }

        .brand-subtitle {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .input-group-text {
            background: #f8f9fa;
            border-right: 0;
        }

        .form-control {
            border-left: 0;
            padding: 12px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #dee2e6;
        }

        .btn-login {
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #adb5bd;
        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- LOGO / IDENTITE -->

        <div class="text-center">

            <div class="brand-icon">
                <i class="bi bi-tools"></i>
            </div>

            <div class="brand-title">
                AB Maintenance
            </div>

            <div class="brand-subtitle">
                Gestion et maintenance des équipements industriels
            </div>

        </div>


        <!-- MESSAGE ERREUR -->

        <div
            th:if="${param.error}"
            class="alert alert-danger d-flex align-items-center"
            role="alert">

            <i class="bi bi-exclamation-triangle-fill me-2"></i>

            <div>
                Email ou mot de passe incorrect.
            </div>

        </div>


        <!-- MESSAGE DECONNEXION -->

        <div
            th:if="${param.logout}"
            class="alert alert-success d-flex align-items-center"
            role="alert">

            <i class="bi bi-check-circle-fill me-2"></i>

            <div>
                Vous avez été déconnecté avec succès.
            </div>

        </div>


        <!-- FORMULAIRE -->

        <form
            th:action="@{/login}"
            method="post">

            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label">

                    Adresse email

                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        id="username"
                        type="email"
                        name="username"
                        class="form-control"
                        placeholder="exemple@abmaintenance.ma"
                        autocomplete="username"
                        required>

                </div>

            </div>


            <!-- MOT DE PASSE -->

            <div class="mb-4">

                <label
                    for="password"
                    class="form-label">

                    Mot de passe

                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required>

                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        id="togglePassword"
                        aria-label="Afficher ou masquer le mot de passe">

                        <i
                            class="bi bi-eye"
                            id="eyeIcon">
                        </i>

                    </button>

                </div>

            </div>


            <!-- BOUTON -->

            <button
                type="submit"
                class="btn btn-dark btn-login w-100">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Se connecter

            </button>

        </form>

    </div>


    <div class="footer-text">

        AB Maintenance • Système de gestion des équipements industriels

    </div>

</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- AFFICHER / MASQUER MOT DE PASSE -->

<script>

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const eyeIcon =
        document.getElementById("eyeIcon");

    togglePassword.addEventListener(
        "click",
        function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                eyeIcon.classList.remove(
                    "bi-eye"
                );

                eyeIcon.classList.add(
                    "bi-eye-slash"
                );

            } else {

                passwordInput.type = "password";

                eyeIcon.classList.remove(
                    "bi-eye-slash"
                );

                eyeIcon.classList.add(
                    "bi-eye"
                );
            }
        }
    );

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${equipement.id == null
        ? 'Ajouter un équipement - AB Maintenance'
        : 'Modifier un équipement - AB Maintenance'}">
        Équipement - AB Maintenance
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #1d2c3a;
            min-height: 100vh;
        }

        .navbar-custom {
            background: #111c28;
            padding: 18px 30px;
        }

        .navbar-brand {
            color: white;
            font-weight: 700;
            font-size: 1.4rem;
            text-decoration: none;
        }

        .navbar-brand:hover {
            color: white;
        }

        .page-container {
            max-width: 1050px;
            margin: 40px auto;
            padding: 0 20px 50px;
        }

        .page-title {
            color: white;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .page-subtitle {
            color: #d4dbe1;
            margin-bottom: 30px;
        }

        .form-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .20);
        }

        .card-header-custom {
            background: #20262a;
            color: white;
            padding: 20px 25px;
        }

        .card-header-custom h4 {
            margin: 0;
            font-weight: 700;
        }

        .form-content {
            padding: 30px;
        }

        .section-title {
            font-weight: 700;
            font-size: 1.05rem;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 12px;
            margin-bottom: 22px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border-radius: 10px;
        }

        textarea.form-control {
            min-height: 120px;
        }

        .btn-action {
            min-width: 140px;
        }

    </style>
</head>

<body>

<!-- ============================= -->
<!-- BARRE SUPÉRIEURE -->
<!-- ============================= -->

<nav class="navbar-custom d-flex justify-content-between align-items-center">

    <a class="navbar-brand"
       th:href="@{/dashboard}">
        <i class="bi bi-gear-wide-connected me-2"></i>
        AB Maintenance
    </a>

    <a th:href="@{/equipements}"
       class="btn btn-outline-light">
        <i class="bi bi-arrow-left me-2"></i>
        Équipements
    </a>

</nav>


<div class="page-container">

    <!-- ============================= -->
    <!-- TITRE -->
    <!-- ============================= -->

    <h1 class="page-title">

        <i class="bi bi-gear-wide-connected me-2"></i>

        <span th:if="${equipement.id == null}">
            Ajouter un équipement
        </span>

        <span th:if="${equipement.id != null}">
            Modifier un équipement
        </span>

    </h1>

    <p class="page-subtitle"
       th:text="${equipement.id == null
            ? 'Enregistrez un nouvel équipement industriel dans le système.'
            : 'Modifiez les informations de cet équipement.'}">
    </p>


    <!-- ============================= -->
    <!-- FORMULAIRE -->
    <!-- ============================= -->

    <div class="form-card">

        <div class="card-header-custom">

            <h4>
                <i class="bi bi-info-circle me-2"></i>
                Informations de l'équipement
            </h4>

        </div>


        <div class="form-content">

            <form
                th:action="@{/equipements/enregistrer}"
                th:object="${equipement}"
                method="post">

                <!-- ID -->
                <input
                    type="hidden"
                    th:field="*{id}">


                <!-- QR CODE EXISTANT -->
                <input
                    type="hidden"
                    th:field="*{qrCode}">


                <!-- PHOTO EXISTANTE -->
                <input
                    type="hidden"
                    th:field="*{photo}">


                <!-- ============================= -->
                <!-- IDENTIFICATION -->
                <!-- ============================= -->

                <div class="section-title">

                    <i class="bi bi-card-text me-2"></i>
                    Identification

                </div>


                <div class="row">


                    <!-- Référence -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Référence
                            <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            th:field="*{reference}"
                            placeholder="Ex : EQ-0001"
                            required>

                    </div>


                    <!-- Nom -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Nom de l'équipement
                            <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            th:field="*{nom}"
                            placeholder="Ex : Compresseur principal"
                            required>

                    </div>


                    <!-- Marque -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Marque
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            th:field="*{marque}"
                            placeholder="Ex : Atlas Copco">

                    </div>


                    <!-- Modèle -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Modèle
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            th:field="*{modele}"
                            placeholder="Ex : GA15">

                    </div>


                    <!-- Numéro série -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Numéro de série
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            th:field="*{numeroSerie}"
                            placeholder="Ex : SN-2026-001">

                    </div>


                    <!-- Année fabrication -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Année de fabrication
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            th:field="*{anneeFabrication}"
                            min="1900"
                            max="2100"
                            placeholder="Ex : 2022">

                    </div>


                    <!-- Date acquisition -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Date d'acquisition
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            th:field="*{dateAcquisition}">

                    </div>


                    <!-- État -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            État de l'équipement
                        </label>

                        <select
                            class="form-select"
                            th:field="*{etat}"
                            required>

                            <option value="OPERATIONNEL">
                                Opérationnel
                            </option>

                            <option value="EN_PANNE">
                                En panne
                            </option>

                            <option value="EN_MAINTENANCE">
                                En maintenance
                            </option>

                            <option value="HORS_SERVICE">
                                Hors service
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ============================= -->
                <!-- AFFECTATION -->
                <!-- ============================= -->

                <div class="section-title mt-4">

                    <i class="bi bi-diagram-3 me-2"></i>
                    Affectation

                </div>


                <div class="row">


                    <!-- Catégorie -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Catégorie
                            <span class="text-danger">*</span>
                        </label>

                        <select
                            class="form-select"
                            th:field="*{categorie}"
                            required>

                            <option value="">
                                Choisir une catégorie
                            </option>

                            <option
                                th:each="categorie : ${categories}"
                                th:value="${categorie.id}"
                                th:text="${categorie.nom}">
                            </option>

                        </select>

                    </div>


                    <!-- Site -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Site
                            <span class="text-danger">*</span>
                        </label>

                        <select
                            class="form-select"
                            th:field="*{site}"
                            required>

                            <option value="">
                                Choisir un site
                            </option>

                            <option
                                th:each="site : ${sites}"
                                th:value="${site.id}"
                                th:text="${site.nom}">
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ============================= -->
                <!-- DESCRIPTION -->
                <!-- ============================= -->

                <div class="section-title mt-4">

                    <i class="bi bi-file-text me-2"></i>
                    Description

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Description de l'équipement
                    </label>

                    <textarea
                        class="form-control"
                        th:field="*{description}"
                        rows="4"
                        placeholder="Informations supplémentaires concernant l'équipement...">
                    </textarea>

                </div>


                <!-- ============================= -->
                <!-- BOUTONS -->
                <!-- ============================= -->

                <div class="d-flex justify-content-end gap-2 flex-wrap">

                    <a
                        th:href="@{/equipements}"
                        class="btn btn-secondary btn-action">

                        <i class="bi bi-x-circle me-1"></i>
                        Annuler

                    </a>


                    <button
                        type="submit"
                        class="btn btn-primary btn-action">

                        <i class="bi bi-check-circle me-1"></i>

                        <span th:if="${equipement.id == null}">
                            Enregistrer
                        </span>

                        <span th:if="${equipement.id != null}">
                            Enregistrer les modifications
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>

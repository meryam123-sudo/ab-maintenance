<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Déclarer une panne - AB Maintenance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #141c26, #283949);
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: rgba(20, 28, 38, 0.98) !important;
            padding: 14px 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,.25);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 22px;
        }

        .page-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 25px 50px;
        }

        .page-header {
            color: white;
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-weight: 700;
            font-size: 36px;
        }

        .page-header p {
            color: #c4ccd4;
        }

        .form-card {
            background: white;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 14px 35px rgba(0,0,0,.25);
        }

        .card-title-bar {
            background: #212529;
            color: white;
            padding: 20px 25px;
        }

        .form-card .card-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 13px;
        }

        .symptom-card {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 15px;
            height: 100%;
            transition: .2s;
        }

        .symptom-card:hover {
            background: #f8f9fa;
        }

        .btn {
            border-radius: 9px;
            font-weight: 500;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/dashboard}">

            <i class="bi bi-gear-wide-connected me-2"></i>
            AB Maintenance

        </a>

        <a th:href="@{/equipements/{id}(id=${panne.equipement.id})}"
           class="btn btn-outline-light">

            <i class="bi bi-arrow-left me-1"></i>
            Retour

        </a>

    </div>

</nav>

<div class="page-container">

    <div class="page-header">

        <h1>
            <i class="bi bi-exclamation-triangle me-2"></i>
            Déclarer une panne
        </h1>

        <p>
            Enregistrez les informations et symptômes observés.
        </p>

    </div>

    <div class="card form-card">

        <div class="card-title-bar">

            <h4 class="mb-0">
                <i class="bi bi-gear me-2"></i>
                <span th:text="${panne.equipement.nom}">
                    Équipement
                </span>
            </h4>

        </div>

        <div class="card-body">

            <div class="alert alert-light border">

                <strong>Référence équipement :</strong>

                <span th:text="${panne.equipement.reference}">
                </span>

            </div>

            <form th:action="@{/pannes/enregistrer}"
                  th:object="${panne}"
                  method="post">

                <input type="hidden"
                       th:field="*{equipement.id}">

                <div class="mb-4">

                    <label class="form-label">
                        Description de la panne
                    </label>

                    <textarea class="form-control"
                              th:field="*{description}"
                              rows="5"
                              placeholder="Décrivez précisément le problème observé..."
                              required>
                    </textarea>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Niveau d'urgence
                    </label>

                    <select class="form-select"
                            th:field="*{urgence}"
                            required>

                        <option value="FAIBLE">
                            Faible
                        </option>

                        <option value="MOYENNE">
                            Moyenne
                        </option>

                        <option value="ELEVEE">
                            Élevée
                        </option>

                        <option value="CRITIQUE">
                            Critique
                        </option>

                    </select>

                </div>

                <h5 class="mb-3">

                    <i class="bi bi-activity me-2"></i>
                    Symptômes observés

                </h5>

                <div class="row g-3 mb-4">

                    <div class="col-md-6"
                         th:each="symptome : ${symptomes}">

                        <div class="symptom-card">

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="checkbox"
                                       th:field="*{symptomes}"
                                       th:value="${symptome.id}">

                                <label class="form-check-label"
                                       th:text="${symptome.nom}">
                                </label>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="d-flex flex-wrap gap-2">

                    <button type="submit"
                            class="btn btn-danger">

                        <i class="bi bi-exclamation-circle me-1"></i>
                        Déclarer la panne

                    </button>

                    <a th:href="@{/equipements/{id}(id=${panne.equipement.id})}"
                       class="btn btn-secondary">

                        Annuler

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
